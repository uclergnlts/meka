services:
  mysql:
    image: mysql:8.4
    container_name: meka-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meka
      MYSQL_USER: meka
      MYSQL_PASSWORD: meka
      MYSQL_ROOT_PASSWORD: meka-local-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - meka-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meka-mysql-data:
