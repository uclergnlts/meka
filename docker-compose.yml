services:
  postgres:
    image: postgres:16-alpine
    container_name: meka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meka-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meka-postgres-data:
